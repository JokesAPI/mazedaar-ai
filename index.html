<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mazedaar AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    #chatbox {
      width: 720px;
      max-width: 98%;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #header {
      background: linear-gradient(90deg, #0078D7, #00b4d8);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #header .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    #header .info h2 {
      color: white;
      font-size: 20px;
      margin: 0;
    }

    #header .info p {
      color: rgba(255,255,255,0.8);
      font-size: 12px;
      margin: 0;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      background: #44ff44;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #messages {
      flex: 1;
      height: 500px;
      overflow-y: auto;
      padding: 20px;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bubble-wrapper {
      display: flex;
      flex-direction: column;
      gap: 3px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bubble-wrapper.user-wrapper { align-items: flex-end; }
    .bubble-wrapper.genie-wrapper { align-items: flex-start; }

    .label {
      font-size: 11px;
      color: #888;
      margin-bottom: 2px;
      padding: 0 6px;
    }

    .bubble {
      max-width: 85%;
      padding: 10px 15px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
    }

    .user-bubble {
      background: #0078D7;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .genie-line {
      background: white;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      animation: fadeIn 0.3s ease;
    }

    .error-bubble {
      background: #ffe0e0;
      color: #cc0000;
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 14px;
    }

    .typing-bubble {
      background: white;
      color: #888;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 10px 15px;
      font-size: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    #langLabel {
      font-size: 11px;
      color: #999;
      text-align: right;
      padding: 4px 16px;
      background: #f0f4f8;
    }

    #quick-btns {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: #f8f9fa;
      overflow-x: auto;
      border-top: 1px solid #eee;
    }

    .quick-btn {
      padding: 6px 14px;
      background: #e8f0fe;
      color: #0078D7;
      border: 1px solid #c5d5f5;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .quick-btn:hover { background: #0078D7; color: white; }

    #inputArea {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid #eee;
    }

    #inputRow {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #userInput {
      flex: 1;
      padding: 12px 16px;
      font-size: 15px;
      border: 1.5px solid #ddd;
      border-radius: 25px;
      outline: none;
      background: #f8f9fa;
    }

    #userInput:focus { border-color: #0078D7; background: white; }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #voiceBtn { background: #28a745; color: white; }
    #voiceBtn.listening { background: #dc3545; animation: pulse 1s infinite; }
    #speakBtn { background: #6f42c1; color: white; }
    #speakBtn.active { background: #dc3545; }
    #sendBtn { background: #0078D7; color: white; }
    #sendBtn:hover { background: #005fa3; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
</head>
<body>
<div id="chatbox">

  <div id="header">
    <div class="avatar">🧞</div>
    <div class="info">
      <h2>Mazedaar AI</h2>
      <p><span id="status-dot"></span>Genie is online • 10 Indian languages</p>
    </div>
  </div>

  <div id="messages">
    <div class="bubble-wrapper genie-wrapper">
      <div class="label">Genie</div>
      <div class="bubble genie-line">Hello! I am Genie 🧞</div>
      <div class="bubble genie-line">Ask me jokes, coding questions, news, riddles, math problems!</div>
      <div class="bubble genie-line">I speak Hindi, Telugu, Tamil, Kannada, Malayalam, Marathi, Gujarati, Bengali, Punjabi, Urdu & English 🇮🇳</div>
    </div>
  </div>

  <div id="langLabel">Language: auto-detect</div>

  <div id="quick-btns">
    <button class="quick-btn" onclick="quickSend('hindi joke')">😄 Hindi Joke</button>
    <button class="quick-btn" onclick="quickSend('telugu joke')">😄 Telugu Joke</button>
    <button class="quick-btn" onclick="quickSend('latest news India')">📰 News</button>
    <button class="quick-btn" onclick="quickSend('give me a riddle')">🧩 Riddle</button>
    <button class="quick-btn" onclick="quickSend('motivational quote')">💪 Quote</button>
    <button class="quick-btn" onclick="quickSend('solve 25 x 48')">🔢 Math</button>
    <button class="quick-btn" onclick="quickSend('python for loop example')">💻 Coding</button>
  </div>

  <div id="inputArea">
    <div id="inputRow">
      <button class="icon-btn" id="voiceBtn" onclick="toggleVoice()" title="Voice Input">🎤</button>
      <input type="text" id="userInput" placeholder="Type or speak..." />
      <button class="icon-btn" id="speakBtn" onclick="toggleSpeak()" title="Voice Response">🔊</button>
      <button class="icon-btn" id="sendBtn" onclick="sendMessage()" title="Send">➤</button>
    </div>
  </div>

</div>

<script>
  let speakEnabled = false;
  let voiceEnabled = false;
  let recognition = null;

  // Voice recognition setup
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'hi-IN';

    recognition.onresult = (e) => {
      document.getElementById("userInput").value = e.results[0][0].transcript;
      sendMessage();
    };
    recognition.onend = () => stopVoice();
    recognition.onerror = () => stopVoice();
  }

  function toggleVoice() {
    if (!recognition) { alert("Use Chrome for voice support."); return; }
    if (!voiceEnabled) {
      voiceEnabled = true;
      recognition.start();
      document.getElementById("voiceBtn").classList.add("listening");
      document.getElementById("voiceBtn").innerHTML = "🛑";
    } else {
      stopVoice();
      recognition.stop();
    }
  }

  function stopVoice() {
    voiceEnabled = false;
    document.getElementById("voiceBtn").classList.remove("listening");
    document.getElementById("voiceBtn").innerHTML = "🎤";
  }

  function toggleSpeak() {
    speakEnabled = !speakEnabled;
    document.getElementById("speakBtn").classList.toggle("active", speakEnabled);
    if (!speakEnabled) speechSynthesis.cancel();
  }

  function speakText(text, lang) {
    if (!speakEnabled) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[#*`]/g, ''));
    const map = { "Hindi":"hi-IN","Telugu":"te-IN","Tamil":"ta-IN","Kannada":"kn-IN",
                  "Malayalam":"ml-IN","Marathi":"mr-IN","Gujarati":"gu-IN",
                  "Bengali":"bn-IN","Punjabi":"pa-IN","Urdu":"ur-PK","English":"en-IN" };
    u.lang = map[lang] || "en-IN";
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }

  function quickSend(text) {
    document.getElementById("userInput").value = text;
    sendMessage();
  }

  document.getElementById("userInput").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  function addUserBubble(message) {
    const messagesDiv = document.getElementById("messages");
    const wrapper = document.createElement("div");
    wrapper.className = "bubble-wrapper user-wrapper";
    wrapper.innerHTML = `<div class="label">You</div><div class="bubble user-bubble">${message}</div>`;
    messagesDiv.appendChild(wrapper);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function addTyping() {
    const messagesDiv = document.getElementById("messages");
    const wrapper = document.createElement("div");
    wrapper.className = "bubble-wrapper genie-wrapper";
    wrapper.id = "typing-indicator";
    wrapper.innerHTML = `<div class="label">Genie</div><div class="typing-bubble">typing...</div>`;
    messagesDiv.appendChild(wrapper);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing-indicator");
    if (t) t.remove();
  }

  function addGenieBubbles(text) {
    const messagesDiv = document.getElementById("messages");
    // Split by newline — each line = separate bubble
    const lines = text.split('\n').filter(l => l.trim() !== '');
    const wrapper = document.createElement("div");
    wrapper.className = "bubble-wrapper genie-wrapper";
    let html = `<div class="label">Genie</div>`;
    lines.forEach(line => {
      html += `<div class="bubble genie-line">${line}</div>`;
    });
    wrapper.innerHTML = html;
    messagesDiv.appendChild(wrapper);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function addErrorBubble(msg) {
    const messagesDiv = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "error-bubble";
    div.textContent = msg;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById("userInput");
    const message = input.value.trim();
    if (!message) return;

    addUserBubble(message);
    input.value = "";
    addTyping();

    try {
      const response = await fetch("https://mazedaar-ai.onrender.com/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, session_id: "user1" })
      });

      const data = await response.json();
      removeTyping();

      if (data.error) {
        addErrorBubble("Error: " + data.error);
      } else {
        addGenieBubbles(data.response);
        if (data.language_detected) {
          document.getElementById("langLabel").innerText = "Language detected: " + data.language_detected;
          const map = { "Hindi":"hi-IN","Telugu":"te-IN","Tamil":"ta-IN","Kannada":"kn-IN",
                        "Malayalam":"ml-IN","Marathi":"mr-IN","Gujarati":"gu-IN",
                        "Bengali":"bn-IN","Punjabi":"pa-IN","Urdu":"ur-PK","English":"en-US" };
          if (recognition) recognition.lang = map[data.language_detected] || "en-US";
          speakText(data.response, data.language_detected);
        }
      }
    } catch (err) {
      removeTyping();
      addErrorBubble("Error connecting to server. Make sure app.py is running.");
    }
  }
</script>
</body>
</html>
